# Pin watch: asks Hugging Face and the registry, daily, whether every pin in
# install.sh still resolves upstream. This is NOT a build gate and never
# runs ci.yml's suite: a green build must not depend on Hugging Face being
# up (check-pins.sh's own header). What this does is turn "an upstream
# deleted a pinned revision" from a silent time bomb (fresh installs fail on
# the one box that does not have the bytes yet) into an issue that names the
# dead pin, filed once, by whoever noticed it: the scheduled run.
name: pin watch

on:
  schedule:
    # Daily, off the hour and off the :00 crowd.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - id: pins
        name: Resolve every pin (network on purpose)
        env:
          # GitHub allows an anonymous caller 60 requests an hour per address, and a runner's
          # address is shared: both tries of 2026-10-02 got 403 with the limit spent and
          # filed issue #34. The workflow's own token lifts the limit; check-pins.sh sends it
          # on stdin, never on a command line.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          rc=0
          ./check-pins.sh | sed -r 's/\x1b\[[0-9;]*m//g' > /tmp/pins.txt || rc=$?
          cat /tmp/pins.txt
          if [ "$rc" != 0 ]; then
            # An endpoint having a bad minute is no dead pin: the run of 2026-10-01 13:08 got
            # three 504s from the GitHub API and filed issue #33 for pins that all resolved
            # after. A pin that still fails ten minutes later is the one worth an issue.
            echo "a pin did not resolve; asking again in 10 minutes"
            sleep 600
            rc=0
            ./check-pins.sh | sed -r 's/\x1b\[[0-9;]*m//g' > /tmp/pins.txt || rc=$?
            cat /tmp/pins.txt
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - if: steps.pins.outputs.rc != '0'
        name: File one issue when a pin died (never a duplicate of an open one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=pin-watch" \
                  --jq length 2>/dev/null || echo 0)"
          if [ "$open" -gt 0 ]; then
            echo "an open pin-watch issue exists, not filing another"
            exit 0
          fi
          DEAD="$(grep -m1 FAIL /tmp/pins.txt | tr -s ' ' | cut -d' ' -f2- || true)"
          {
            echo '### A pin no longer resolves upstream'
            echo
            echo './check-pins.sh failed on the scheduled run, twice, ten'
            echo 'minutes apart. A dead pin is a time bomb: machines that'
            echo 'already hold the bytes keep serving, fresh installs fail.'
            echo 'The second output below.'
            echo
            echo '```'
            cat /tmp/pins.txt
            echo '```'
            echo
            echo 'First, confirm it is real: a pin that could not be asked'
            echo 'about (an endpoint down, no registry token) counts as a'
            echo 'failure and passes on a retry; a gated repo is one a fresh'
            echo 'install cannot download without a token. Then re-pin'
            echo 'install.sh to a surviving revision with the bench and'
            echo 'quality cycle the target table demands, or mirror the bytes.'
          } > /tmp/pin-body.md
          # --label fails the whole call when the label does not exist, and nothing else in the
          # repo creates it: the first dead pin would have ended in a red run and no issue
          # (found in review, 2026-09-24). --force makes this a no-op when it is there.
          gh label create pin-watch -R "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "a pinned revision, digest or release no longer resolves"
          gh issue create -R "$GITHUB_REPOSITORY" --label pin-watch \
            --title "a pin died: ${DEAD:0:80}" \
            --body-file /tmp/pin-body.md
